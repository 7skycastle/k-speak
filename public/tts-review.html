<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Korean TTS Review</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7f9;
        --surface: #ffffff;
        --ink: #14171f;
        --muted: #667085;
        --line: #d9dee8;
        --accent: #0f766e;
        --accent-dark: #115e59;
        --warn: #b45309;
        --bad: #b42318;
        --ok: #14754f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 10;
        border-bottom: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.96);
        backdrop-filter: blur(12px);
      }

      .bar,
      main {
        width: min(1180px, calc(100% - 32px));
        margin: 0 auto;
      }

      .bar {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 16px;
        align-items: center;
        padding: 16px 0;
      }

      h1 {
        margin: 0;
        font-size: 20px;
        line-height: 1.2;
      }

      .sub {
        margin-top: 5px;
        color: var(--muted);
        font-size: 13px;
      }

      .actions,
      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      button,
      select,
      textarea,
      input {
        font: inherit;
      }

      button {
        min-height: 36px;
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--ink);
        padding: 0 12px;
        border-radius: 6px;
        cursor: pointer;
      }

      button.primary {
        border-color: var(--accent);
        background: var(--accent);
        color: #fff;
      }

      button.active {
        border-color: var(--accent);
        color: var(--accent-dark);
      }

      main {
        padding: 18px 0 40px;
      }

      .summary {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 10px;
        margin-bottom: 14px;
      }

      .metric,
      .item {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
      }

      .metric {
        padding: 12px;
      }

      .metric b {
        display: block;
        font-size: 20px;
      }

      .metric span {
        color: var(--muted);
        font-size: 12px;
      }

      .toolbar {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
        align-items: center;
        margin-bottom: 14px;
      }

      .search {
        width: 100%;
        min-height: 38px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--surface);
        padding: 0 12px;
      }

      .list {
        display: grid;
        gap: 12px;
      }

      .item {
        overflow: hidden;
      }

      .sentence {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
        align-items: start;
        padding: 14px;
        border-bottom: 1px solid var(--line);
      }

      .sentence h2 {
        margin: 0 0 6px;
        font-size: 18px;
        line-height: 1.35;
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        color: var(--muted);
        font-size: 12px;
      }

      .tag {
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 3px 8px;
      }

      .models {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .model {
        padding: 14px;
      }

      .model + .model {
        border-left: 1px solid var(--line);
      }

      .model-head {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: start;
        margin-bottom: 10px;
      }

      .model-title {
        font-weight: 700;
      }

      .license {
        color: var(--muted);
        font-size: 12px;
      }

      .audio-grid {
        display: grid;
        gap: 8px;
        margin: 10px 0 12px;
      }

      .audio-row {
        display: grid;
        grid-template-columns: 58px 1fr;
        gap: 10px;
        align-items: center;
      }

      audio {
        width: 100%;
        min-width: 0;
      }

      .score-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      label {
        display: grid;
        gap: 4px;
        color: var(--muted);
        font-size: 12px;
      }

      select,
      textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
        color: var(--ink);
      }

      select {
        min-height: 34px;
        padding: 0 8px;
      }

      textarea {
        min-height: 64px;
        resize: vertical;
        padding: 8px;
        line-height: 1.4;
      }

      .notes {
        margin-top: 8px;
      }

      .status-approved {
        color: var(--ok);
      }

      .status-issue {
        color: var(--warn);
      }

      .status-reject {
        color: var(--bad);
      }

      .empty {
        border: 1px dashed var(--line);
        border-radius: 8px;
        background: var(--surface);
        padding: 24px;
        text-align: center;
        color: var(--muted);
      }

      @media (max-width: 820px) {
        .bar,
        .toolbar,
        .sentence {
          grid-template-columns: 1fr;
        }

        .summary {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .models,
        .score-grid {
          grid-template-columns: 1fr;
        }

        .model + .model {
          border-left: 0;
          border-top: 1px solid var(--line);
        }

        .actions,
        .filters {
          width: 100%;
        }

        button {
          flex: 1 1 auto;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="bar">
        <div>
          <h1>Korean TTS Review</h1>
          <div class="sub">MeloTTS-Korean vs Qwen3-TTS Sohee audition pack</div>
        </div>
        <div class="actions">
          <button id="exportBtn" class="primary" type="button">Export JSON</button>
          <button id="resetBtn" type="button">Reset Local Review</button>
        </div>
      </div>
    </header>

    <main>
      <section class="summary" aria-label="Review summary">
        <div class="metric"><b id="metricSentences">0</b><span>sentences</span></div>
        <div class="metric"><b id="metricAudios">0</b><span>audio files</span></div>
        <div class="metric"><b id="metricReviewed">0</b><span>reviewed model rows</span></div>
        <div class="metric"><b id="metricApproved">0</b><span>approved</span></div>
        <div class="metric"><b id="metricIssues">0</b><span>issues or rejects</span></div>
      </section>

      <section class="toolbar" aria-label="Review filters">
        <input id="search" class="search" type="search" placeholder="Search Korean, romanization, day, or tag" />
        <div class="filters">
          <button class="active" data-filter="all" type="button">All</button>
          <button data-filter="unreviewed" type="button">Unreviewed</button>
          <button data-filter="issues" type="button">Issues</button>
          <button data-filter="approved" type="button">Approved</button>
        </div>
      </section>

      <section id="list" class="list" aria-live="polite"></section>
    </main>

    <script>
      const DATA_URL = "/audio/audition/review-data.json";
      const STORAGE_KEY = "korean-first-talk.ttsReview.v1";
      const modelLabels = {
        "melotts-korean-candidate": "MeloTTS-Korean",
        "qwen3-tts-12hz-0.6b-customvoice-sohee": "Qwen3 Sohee",
      };
      const scoreOptions = [
        ["", "Not reviewed"],
        ["5", "5 Excellent"],
        ["4", "4 Good"],
        ["3", "3 Usable"],
        ["2", "2 Weak"],
        ["1", "1 Fail"],
      ];
      const decisionOptions = [
        ["not_reviewed", "Not reviewed"],
        ["approved", "Approved"],
        ["issue", "Needs check"],
        ["reject", "Reject"],
      ];

      let reviewData = null;
      let reviews = loadReviews();
      let filter = "all";

      function loadReviews() {
        try {
          return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
        } catch {
          return {};
        }
      }

      function saveReviews() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(reviews));
        updateMetrics();
      }

      function reviewKey(sentenceId, modelId) {
        return `${sentenceId}::${modelId}`;
      }

      function escapeHtml(value) {
        return String(value || "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function fieldValue(sentenceId, modelId, field) {
        return reviews[reviewKey(sentenceId, modelId)]?.[field] || "";
      }

      function setField(sentenceId, modelId, field, value) {
        const key = reviewKey(sentenceId, modelId);
        reviews[key] = { ...(reviews[key] || {}), sentenceId, modelId, [field]: value };
        reviews[key].updatedAt = new Date().toISOString();
        saveReviews();
        updateRowStatus(sentenceId, modelId);
      }

      function selectHtml(value, options, attrs) {
        return `<select ${attrs}>${options
          .map(([optionValue, label]) => `<option value="${optionValue}" ${optionValue === value ? "selected" : ""}>${escapeHtml(label)}</option>`)
          .join("")}</select>`;
      }

      function modelStatus(sentenceId, modelId) {
        const decision = fieldValue(sentenceId, modelId, "decision") || "not_reviewed";
        if (decision === "approved") return ["status-approved", "Approved"];
        if (decision === "issue") return ["status-issue", "Needs check"];
        if (decision === "reject") return ["status-reject", "Reject"];
        return ["", "Not reviewed"];
      }

      function render() {
        const list = document.querySelector("#list");
        const query = document.querySelector("#search").value.trim().toLowerCase();
        const items = reviewData.items.filter((item) => matches(item, query) && matchesFilter(item));

        if (!items.length) {
          list.innerHTML = '<div class="empty">No review rows match the current filter.</div>';
          updateMetrics();
          return;
        }

        list.innerHTML = items.map(renderItem).join("");
        bindControls();
        updateMetrics();
      }

      function matches(item, query) {
        if (!query) return true;
        const haystack = [
          item.sentenceId,
          item.lessonId,
          item.phraseId,
          item.koreanText,
          item.romanization,
          ...item.auditionTags,
        ]
          .join(" ")
          .toLowerCase();
        return haystack.includes(query);
      }

      function matchesFilter(item) {
        const modelIds = Object.keys(item.models);
        const decisions = modelIds.map((modelId) => fieldValue(item.sentenceId, modelId, "decision") || "not_reviewed");
        if (filter === "unreviewed") return decisions.some((decision) => decision === "not_reviewed");
        if (filter === "issues") return decisions.some((decision) => decision === "issue" || decision === "reject");
        if (filter === "approved") return decisions.some((decision) => decision === "approved");
        return true;
      }

      function renderItem(item) {
        const tags = item.auditionTags.map((tag) => `<span class="tag">${escapeHtml(tag)}</span>`).join("");
        const models = Object.values(item.models)
          .sort((a, b) => a.modelId.localeCompare(b.modelId))
          .map((model) => renderModel(item, model))
          .join("");
        return `
          <article class="item" data-sentence-id="${item.sentenceId}">
            <div class="sentence">
              <div>
                <h2>${escapeHtml(item.koreanText)}</h2>
                <div class="meta">
                  <span>${escapeHtml(item.lessonId)}</span>
                  <span>${escapeHtml(item.romanization)}</span>
                  ${tags}
                </div>
              </div>
              <button type="button" data-play-pair="${item.sentenceId}">Play Normal Pair</button>
            </div>
            <div class="models">${models}</div>
          </article>
        `;
      }

      function renderModel(item, model) {
        const [statusClass, statusText] = modelStatus(item.sentenceId, model.modelId);
        const normal = model.audio.normal;
        const slow = model.audio.slow;
        return `
          <section class="model" data-review-row="${reviewKey(item.sentenceId, model.modelId)}">
            <div class="model-head">
              <div>
                <div class="model-title">${escapeHtml(modelLabels[model.modelId] || model.modelId)}</div>
                <div class="license">${escapeHtml(model.license)} · ${escapeHtml(model.voiceId)}</div>
              </div>
              <strong class="${statusClass}" data-row-status>${escapeHtml(statusText)}</strong>
            </div>
            <div class="audio-grid">
              ${audioRow("Normal", normal)}
              ${audioRow("Slow", slow)}
            </div>
            <div class="score-grid">
              <label>Pronunciation
                ${selectHtml(fieldValue(item.sentenceId, model.modelId, "pronunciation"), scoreOptions, dataAttrs(item, model, "pronunciation"))}
              </label>
              <label>Naturalness
                ${selectHtml(fieldValue(item.sentenceId, model.modelId, "naturalness"), scoreOptions, dataAttrs(item, model, "naturalness"))}
              </label>
              <label>Slow quality
                ${selectHtml(fieldValue(item.sentenceId, model.modelId, "slowQuality"), scoreOptions, dataAttrs(item, model, "slowQuality"))}
              </label>
              <label>Decision
                ${selectHtml(fieldValue(item.sentenceId, model.modelId, "decision") || "not_reviewed", decisionOptions, dataAttrs(item, model, "decision"))}
              </label>
            </div>
            <label class="notes">Notes
              <textarea ${dataAttrs(item, model, "notes")} placeholder="발음 오류, 어색한 억양, 느린 음성 문제 등을 기록">${escapeHtml(fieldValue(item.sentenceId, model.modelId, "notes"))}</textarea>
            </label>
          </section>
        `;
      }

      function audioRow(label, audio) {
        return `
          <div class="audio-row">
            <strong>${label}</strong>
            <audio controls preload="none" src="${audio.src}"></audio>
          </div>
        `;
      }

      function dataAttrs(item, model, field) {
        return `data-sentence-id="${item.sentenceId}" data-model-id="${model.modelId}" data-field="${field}"`;
      }

      function bindControls() {
        document.querySelectorAll("select[data-field], textarea[data-field]").forEach((control) => {
          control.addEventListener("change", onReviewChange);
          control.addEventListener("input", (event) => {
            if (event.target.tagName === "TEXTAREA") onReviewChange(event);
          });
        });
        document.querySelectorAll("[data-play-pair]").forEach((button) => {
          button.addEventListener("click", () => playNormalPair(button.dataset.playPair));
        });
      }

      function onReviewChange(event) {
        const { sentenceId, modelId, field } = event.target.dataset;
        setField(sentenceId, modelId, field, event.target.value);
      }

      function updateRowStatus(sentenceId, modelId) {
        const row = document.querySelector(`[data-review-row="${reviewKey(sentenceId, modelId)}"]`);
        if (!row) return;
        const [statusClass, statusText] = modelStatus(sentenceId, modelId);
        const status = row.querySelector("[data-row-status]");
        status.className = statusClass;
        status.textContent = statusText;
      }

      function updateMetrics() {
        if (!reviewData) return;
        const modelRows = reviewData.items.flatMap((item) => Object.keys(item.models).map((modelId) => reviewKey(item.sentenceId, modelId)));
        const decisions = modelRows.map((key) => reviews[key]?.decision || "not_reviewed");
        document.querySelector("#metricSentences").textContent = reviewData.sentenceCount;
        document.querySelector("#metricAudios").textContent = reviewData.entryCount;
        document.querySelector("#metricReviewed").textContent = decisions.filter((decision) => decision !== "not_reviewed").length;
        document.querySelector("#metricApproved").textContent = decisions.filter((decision) => decision === "approved").length;
        document.querySelector("#metricIssues").textContent = decisions.filter((decision) => decision === "issue" || decision === "reject").length;
      }

      async function playNormalPair(sentenceId) {
        const item = reviewData.items.find((candidate) => candidate.sentenceId === sentenceId);
        if (!item) return;
        const sources = Object.values(item.models)
          .sort((a, b) => a.modelId.localeCompare(b.modelId))
          .map((model) => model.audio.normal.src);
        for (const source of sources) {
          const audio = new Audio(source);
          await audio.play();
          await new Promise((resolve) => {
            audio.onended = resolve;
            audio.onerror = resolve;
          });
        }
      }

      function exportReviews() {
        const payload = {
          exportedAt: new Date().toISOString(),
          source: DATA_URL,
          reviews: Object.values(reviews),
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `tts-review-${new Date().toISOString().slice(0, 10)}.json`;
        link.click();
        URL.revokeObjectURL(url);
      }

      async function init() {
        const response = await fetch(DATA_URL);
        if (!response.ok) throw new Error(`Could not load ${DATA_URL}`);
        reviewData = await response.json();
        render();
      }

      document.querySelector("#search").addEventListener("input", render);
      document.querySelectorAll("[data-filter]").forEach((button) => {
        button.addEventListener("click", () => {
          filter = button.dataset.filter;
          document.querySelectorAll("[data-filter]").forEach((item) => item.classList.toggle("active", item === button));
          render();
        });
      });
      document.querySelector("#exportBtn").addEventListener("click", exportReviews);
      document.querySelector("#resetBtn").addEventListener("click", () => {
        if (!confirm("Clear local review scores and notes?")) return;
        reviews = {};
        saveReviews();
        render();
      });

      init().catch((error) => {
        document.querySelector("#list").innerHTML = `<div class="empty">${error.message}</div>`;
      });
    </script>
  </body>
</html>
